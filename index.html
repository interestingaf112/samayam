<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സമയം | Premium Cafe</title>
    
    <!-- Fonts: Using Montserrat for that heavy, bold, italicized look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons for the hamburger menu -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        malayalam: ['Montserrat', 'sans-serif'], // Reusing Montserrat for uniformity
                    },
                    colors: {
                        brand: {
                            red: '#e21822',     // Bright, punchy red
                            dark: '#111111',
                            light: '#f4f4f4'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --cursor-size: 16px;
        }

        body {
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
            cursor: none; 
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* Fullscreen Background Image with Blur */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            object-fit: cover;
            filter: blur(8px) brightness(0.6);
            transform: scale(1.1);
            animation: bgDrift 20s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            0% { transform: scale(1.1) translate(0, 0); }
            100% { transform: scale(1.15) translate(-1%, 2%); }
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--cursor-size);
            height: var(--cursor-size);
            border-radius: 50%;
            background-color: #e21822;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease, background-color 0.2s ease;
            mix-blend-mode: normal;
        }

        .cursor-hover .custom-cursor {
            width: 60px;
            height: 60px;
            background-color: white;
            mix-blend-mode: difference;
        }

        /* Typography Styling */
        .hero-title {
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -0.02em;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
        }

        .hero-subtitle {
            font-weight: 400;
            letter-spacing: 0.01em;
            text-shadow: 1px 2px 5px rgba(0,0,0,0.5);
        }

        /* Buttons */
        .btn-bold {
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        
        .btn-bold:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .btn-bold:active {
            transform: scale(0.95);
        }

        /* Navbar pill */
        .nav-pill {
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .nav-pill:hover {
            transform: translateY(-2px);
        }

        /* Animations */
        .split-text span {
            display: inline-block;
            opacity: 0;
            transform: translateY(50px) rotateX(-45deg);
            animation: textPopUp 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes textPopUp {
            0% { opacity: 0; transform: translateY(50px) scale(0.9) skewX(10deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) skewX(0deg); }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: simpleFadeUp 1s ease-out forwards;
        }

        @keyframes simpleFadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #e21822;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #loader.hidden {
            transform: translateY(-100%);
            pointer-events: none;
        }
        
        .loader-logo {
            font-weight: 900;
            font-size: 5vw;
            color: white;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            animation: pulse 1s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }

        /* Magnetic effect wrapper */
        .magnetic-wrap {
            display: inline-block;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col relative">

    <!-- Loader -->
    <div id="loader">
        <h1 class="loader-logo">സമയം.</h1>
    </div>

    <!-- Custom Cursor -->
    <div class="custom-cursor hidden md:block"></div>

    <!-- Background Image -->
    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?q=80&w=2574&auto=format&fit=crop" alt="Coffee Background" class="bg-layer">
    
    <!-- Dark Gradient Overlay for text readability -->
    <div class="fixed inset-0 bg-gradient-to-b from-black/20 via-black/10 to-black/60 z-[-1]"></div>

    <!-- Top Navigation -->
    <nav class="fixed top-6 left-6 right-6 z-50 flex justify-between items-center px-2 md:px-8 pointer-events-none">
        
        <!-- Logo Pill -->
        <a href="#" class="nav-pill pointer-events-auto bg-[#f4f4f4] text-brand-red font-black text-2xl md:text-3xl px-6 py-2 rounded-[2rem] flex items-center hover-trigger uppercase tracking-tighter shadow-lg">
            സമ<span class="text-black ml-1 text-3xl">☕</span>യം
        </a>

        <!-- Right Menu Pill Combo -->
        <div class="pointer-events-auto flex rounded-[2rem] overflow-hidden shadow-lg border border-white/20 nav-pill">
            <button class="bg-[#f4f4f4] text-brand-red font-bold text-sm md:text-base px-6 py-3 uppercase hover:bg-white transition-colors hover-trigger">
                Shop
            </button>
            <button class="bg-brand-red text-white font-bold text-sm md:text-base px-6 py-3 uppercase flex items-center gap-2 hover:bg-[#c2141c] transition-colors hover-trigger">
                <i class="ph ph-list text-xl"></i> Menu
            </button>
        </div>
    </nav>

    <!-- Main Hero Content -->
    <main class="flex-1 flex flex-col justify-center items-center text-center px-4 z-10 w-full h-full">
        
        <!-- Giant Bold Typography -->
        <h1 class="hero-title text-white text-[12vw] md:text-[9vw] lg:text-[8vw] flex flex-col items-center">
            <div class="split-text overflow-hidden"><span style="animation-delay: 0.8s;">THE MOST</span></div>
            <div class="split-text overflow-hidden"><span style="animation-delay: 0.9s;">CAFFEINATED COFFEE</span></div>
            <div class="split-text overflow-hidden"><span style="animation-delay: 1.0s;">IN THE WORLD</span></div>
        </h1>

        <!-- Subtitle -->
        <p class="hero-subtitle text-white text-xl md:text-3xl mt-8 mb-10 fade-up" style="animation-delay: 1.3s; opacity: 0;">
            The Keralanest of coffees
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 fade-up" style="animation-delay: 1.5s; opacity: 0;">
            
            <div class="magnetic-wrap hover-trigger">
                <button class="btn-bold bg-brand-red text-white text-lg px-8 py-4 rounded-xl w-full sm:w-auto shadow-[0_4px_14px_0_rgba(226,24,34,0.39)] hover:shadow-[0_6px_20px_rgba(226,24,34,0.23)]">
                    OUR BREWS
                </button>
            </div>
            
            <div class="magnetic-wrap hover-trigger">
                <button class="btn-bold bg-[#f4f4f4] text-brand-red text-lg px-8 py-4 rounded-xl w-full sm:w-auto shadow-[0_4px_14px_0_rgba(255,255,255,0.2)] hover:shadow-[0_6px_20px_rgba(255,255,255,0.23)]">
                    SHOP MERCH
                </button>
            </div>

        </div>

    </main>

    <!-- Interactive Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // Loader Exit Animation
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 600); // Quick, energetic load

            // Custom Cursor Logic
            const cursor = document.querySelector('.custom-cursor');
            const hoverTriggers = document.querySelectorAll('.hover-trigger, button, a');

            if (window.matchMedia("(pointer: fine)").matches) {
                document.addEventListener('mousemove', (e) => {
                    cursor.style.left = `${e.clientX}px`;
                    cursor.style.top = `${e.clientY}px`;
                });

                hoverTriggers.forEach(trigger => {
                    trigger.addEventListener('mouseenter', () => {
                        document.body.classList.add('cursor-hover');
                    });
                    trigger.addEventListener('mouseleave', () => {
                        document.body.classList.remove('cursor-hover');
                    });
                });

                // Magnetic Button Logic
                const magneticWraps = document.querySelectorAll('.magnetic-wrap');
                magneticWraps.forEach(wrap => {
                    const btn = wrap.querySelector('button');
                    
                    wrap.addEventListener('mousemove', (e) => {
                        const rect = wrap.getBoundingClientRect();
                        const x = e.clientX - rect.left - rect.width / 2;
                        const y = e.clientY - rect.top - rect.height / 2;
                        
                        btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) scale(1.05)`;
                    });

                    wrap.addEventListener('mouseleave', () => {
                        btn.style.transform = `translate(0px, 0px) scale(1)`;
                    });
                });
            }
        });
    </script>
</body>
</html>
